<section id="{{ section_id }}">

    <div class="section-header">

        <h2>
            {{ section_title }}
        </h2>

        <a href="#">
            View More →
        </a>

    </div>

    <div class="news-row">

        {% for article in articles %}

            {% include "includes/news_card.html" %}

        {% empty %}

            <p>No articles found.</p>

        {% endfor %}

    </div>

</section>
