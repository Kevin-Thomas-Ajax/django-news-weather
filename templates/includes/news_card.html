<a
    href="{{ article.url }}"
    target="_blank"
    class="news-card">

    {% if article.image %}
        <img
            src="{{ article.image }}"
            alt="{{ article.title }}">
    {% else %}
        <div class="news-card-image-placeholder">
            No Image
        </div>
    {% endif %}

    <div class="news-card-content">

        <h3>{{ article.title }}</h3>

        <p>
            {{ article.summary|truncatewords:25 }}
        </p>

    </div>

    <div class="news-card-footer">

        <span class="news-source">
            {{ article.source }}
        </span>

        <span class="news-date">
            {{ article.published_at|date:"d M Y" }}
        </span>

    </div>

</a>
